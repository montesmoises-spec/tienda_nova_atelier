{% extends 'layout.html' %}

{% block content %}
<div class="container my-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="h3 mb-0 text-gray-800 fw-bold">Crear Nuevo Cliente</h1>
        <a href="{{ url_for('cliente.index') }}" class="btn btn-outline-secondary shadow-sm">
            <i class="bi bi-arrow-left me-1"></i> Volver a la Lista
        </a>
    </div>

    <div class="card shadow-sm border-0 rounded-3">
        <div class="card-header bg-white py-3">
            <h5 class="card-title mb-0 font-weight-bold text-primary">Información del Cliente</h5>
        </div>
        <div class="card-body p-4">
            <form action="{{ url_for('cliente.crear') }}" method="POST">
                <div class="row g-3">
                    <div class="col-12">
                        <label for="nombre" class="form-label fw-semibold">Nombre Completo</label>
                        <input type="text" class="form-control" id="nombre" name="nombre" placeholder="Ej: Pedro Pérez" required>
                    </div>

                    <div class="col-md-6">
                        <label for="email" class="form-label fw-semibold">Correo Electrónico</label>
                        <input type="email" class="form-control" id="email" name="email" placeholder="ejemplo@correo.com" required>
                    </div>

                    <div class="col-md-6">
                        <label for="telefono" class="form-label fw-semibold">Teléfono</label>
                        <input type="text" class="form-control" id="telefono" name="telefono" placeholder="+56 9 1234 5678" required>
                    </div>
                </div>

                <hr class="my-4">

                <div class="d-flex justify-content-end gap-2">
                    <a href="{{ url_for('cliente.index') }}" class="btn btn-light border">Cancelar</a>
                    <button type="submit" class="btn btn-primary shadow-sm">
                        <i class="bi bi-check-lg me-1"></i> Guardar Cliente
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
