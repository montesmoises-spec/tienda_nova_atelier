{% extends 'layout.html' %}

{% block content %}
<div class="container my-4">
    <!-- Encabezado y botón Volver -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="h3 mb-0 text-gray-800 fw-bold">Crear Nuevo Producto</h1>
        <a href="{{ url_for('producto.index') }}" class="btn btn-outline-secondary shadow-sm">
            <i class="bi bi-arrow-left me-1"></i> Volver a la Lista
        </a>
    </div>

    <!-- Tarjeta del Formulario -->
    <div class="card shadow-sm border-0 rounded-3">
        <div class="card-header bg-white py-3">
            <h5 class="card-title mb-0 font-weight-bold text-primary">Información del Producto</h5>
        </div>
        <div class="card-body p-4">
            <form action="{{ url_for('producto.crear') }}" method="POST">
                <div class="row g-3">
                    <div class="col-12">
                        <label for="nombre" class="form-label fw-semibold">Nombre del Producto</label>
                        <input type="text" class="form-control" id="nombre" name="nombre" placeholder="Ej: Mouse Inalámbrico" required>
                    </div>

                    <div class="col-md-6">
                        <label for="precio" class="form-label fw-semibold">Precio</label>
                        <div class="input-group">
                            <span class="input-group-text">\$</span>
                            <input type="number" step="0.01" class="form-control" id="precio" name="precio" placeholder="0.00" required>
                        </div>
                    </div>

                    <div class="col-md-6">
                        <label for="stock" class="form-label fw-semibold">Stock Inicial</label>
                        <input type="number" class="form-control" id="stock" name="stock" placeholder="Cantidad disponible" required>
                    </div>
                </div>

                <hr class="my-4">

                <div class="d-flex justify-content-end gap-2">
                    <a href="{{ url_for('producto.index') }}" class="btn btn-light border">Cancelar</a>
                    <button type="submit" class="btn btn-primary shadow-sm">
                        <i class="bi bi-check-lg me-1"></i> Guardar Producto
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
